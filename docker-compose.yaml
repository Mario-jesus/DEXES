services:
  redis:
    image: redis:8.0.5-alpine3.21
    container_name: redis-pubsub
    ports:
      - "6379:6379"
    networks:
      - trading_network
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine3.22
    container_name: postgres-db
    environment:
      POSTGRES_DB: ${PGDATABASE}
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
    ports:
      - "4432:5432"
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - trading_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER} -d ${PGDATABASE}"]
      interval: 5s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  migration:
    image: copy-trading-bot:1.0.0
    container_name: alembic-migration
    command: pipenv run alembic upgrade head
    environment:
      - PGHOST=postgres
      - PGPORT=5432
      - PGDATABASE=${PGDATABASE}
      - PGUSER=${PGUSER}
      - PGPASSWORD=${PGPASSWORD}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - trading_network
    restart: no

  pdc-agent-copy-trading:
    image: grafana/pdc-agent:0.0.49
    container_name: pdc-agent
    command:
      - -token
      - ${GCLOUD_PDC_SIGNING_TOKEN}
      - -cluster
      - "${GCLOUD_PDC_CLUSTER}"
      - -gcloud-hosted-grafana-id
      - "${GCLOUD_HOSTED_GRAFANA_ID}"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - trading_network
    restart: unless-stopped

  pumpfun_bridge:
    image: copy-trading-bot:1.0.0
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pumpfun-redis-bridge
    ports:
      - "7777:8888"
    environment:
      - PUMPFUN_REDIS_URL=redis://redis:6379/0
      - PUMPFUN_REDIS_NAMESPACE=pumpfun
      - PUMPFUN_API_KEY=${PUMPFUN_API_KEY}
      - PUMPFUN_KEEP_NEW_TOKEN_ACTIVE=true
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - trading_network
    restart: unless-stopped

  COPY_TRADING_BOT_A:
    image: copy-trading-bot:1.0.0
    container_name: COPY_TRADING_BOT_A
    ports:
      - "7778:8888"
    environment:
      - CONFIG_FILE_PATH=copy_trading/configs_in_json/config-A.json
      - PGHOST=postgres
      - PGPORT=5432
      - PGDATABASE=${PGDATABASE}
      - PGUSER=${PGUSER}
      - PGPASSWORD=${PGPASSWORD}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pumpfun_bridge:
        condition: service_started
      migration:
        condition: service_completed_successfully
    networks:
      - trading_network
    restart: unless-stopped

  COPY_TRADING_BOT_B:
    image: copy-trading-bot:1.0.0
    container_name: COPY_TRADING_BOT_B
    ports:
      - "7779:8888"
    environment:
      - CONFIG_FILE_PATH=copy_trading/configs_in_json/config-B.json
      - PGHOST=postgres
      - PGPORT=5432
      - PGDATABASE=${PGDATABASE}
      - PGUSER=${PGUSER}
      - PGPASSWORD=${PGPASSWORD}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pumpfun_bridge:
        condition: service_started
      migration:
        condition: service_completed_successfully
    networks:
      - trading_network
    restart: unless-stopped

  COPY_TRADING_BOT_C:
    image: copy-trading-bot:1.0.0
    container_name: COPY_TRADING_BOT_C
    ports:
      - "7780:8888"
