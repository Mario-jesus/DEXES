services:
  redis:
    image: redis:8.0.5-alpine3.21
    container_name: redis-pubsub
    ports:
      - "6379:6379"
    networks:
      - trading_network
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine3.22
    container_name: postgres-db
    environment:
      POSTGRES_DB: ${PGDATABASE}
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
    ports:
      - "4432:5432"
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - trading_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER} -d ${PGDATABASE}"]
      interval: 5s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  migration:
    image: copy-trading-bot:1.0.0
    container_name: alembic-migration
    command: pipenv run alembic upgrade head
    environment:
      - PGHOST=postgres
      - PGPORT=5432
      - PGDATABASE=${PGDATABASE}
      - PGUSER=${PGUSER}
      - PGPASSWORD=${PGPASSWORD}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - trading_network
    restart: no

  pdc-agent:
    image: grafana/pdc-agent:0.0.49
    container_name: pdc-agent-copy-trading
    command:
      - -token
      - ${GCLOUD_PDC_SIGNING_TOKEN}
      - -cluster
      - "${GCLOUD_PDC_CLUSTER}"
      - -gcloud-hosted-grafana-id
      - "${GCLOUD_HOSTED_GRAFANA_ID}"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - trading_network
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.10.2
    container_name: node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - trading_network

  # Prometheus: run ./scripts/generate-prometheus-config.sh first (uses .env for Grafana Cloud credentials)
  prometheus:
    image: prom/prometheus:v3.5.1
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - pdc-agent
      - cadvisor
    networks:
      - trading_network

  pumpfun_bridge:
    image: copy-trading-bot:1.0.0
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pumpfun-redis-bridge
    ports:
      - "7777:8888"
    environment:
      - PUMPFUN_REDIS_URL=redis://redis:6379/0
      - PUMPFUN_REDIS_NAMESPACE=pumpfun
      - PUMPFUN_API_KEY=${PUMPFUN_API_KEY}
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/copy_trading/logs
    networks:
      - trading_network
    restart: unless-stopped

  COPY_TRADING_BOT_A:
    image: copy-trading-bot:1.0.0
    container_name: COPY_TRADING_BOT_A
    ports:
      - "7778:8888"
    environment:
      - CONFIG_FILE_PATH=copy_trading/configs_in_json/config-A.json
      - PGHOST=postgres
      - PGPORT=5432
      - PGDATABASE=${PGDATABASE}
      - PGUSER=${PGUSER}
      - PGPASSWORD=${PGPASSWORD}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pumpfun_bridge:
        condition: service_started
      migration:
        condition: service_completed_successfully
    volumes:
      - ./logs:/app/copy_trading/logs
    networks:
      - trading_network
    restart: unless-stopped

